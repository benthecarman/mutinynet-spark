name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Override in repo Settings > Variables if the image owner differs.
  IMAGE_OWNER: ${{ vars.IMAGE_OWNER || github.repository_owner }}

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev protobuf-compiler
      - run: rustup component add clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPARK_REF: ${{ runner.temp }}/spark-ref
      LDK_SERVER_REF: ${{ runner.temp }}/ldk-server-ref
      SPARK_ADMIN_TOKEN: regtest-spark-admin-token
      LN_STREAM_IDLE_SECONDS: 95
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check out pinned upstream sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/benthecarman/spark "$SPARK_REF"
          git -C "$SPARK_REF" fetch --depth=1 origin dad8bc6cf109b5946eec6860fb84bf247c8cae98
          git -C "$SPARK_REF" checkout --detach FETCH_HEAD
          git clone --filter=blob:none --no-checkout https://github.com/lightningdevkit/ldk-server "$LDK_SERVER_REF"
          git -C "$LDK_SERVER_REF" fetch --depth=1 origin 6d6d810714706c225ce7effc2163eff6a1b54221
          git -C "$LDK_SERVER_REF" checkout --detach FETCH_HEAD
      - name: Build pinned Spark SDK
        working-directory: ${{ runner.temp }}/spark-ref/sdks/js
        run: |
          corepack enable
          yarn install --no-immutable
          yarn build:sdk
      - name: Run full regtest suite
        run: ./e2e/e2e.sh
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.regtest.yml down --volumes --remove-orphans

  lightning-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPARK_REF: ${{ runner.temp }}/spark-ref
      SPARK_OPERATOR_COMMIT: dad8bc6cf109b5946eec6860fb84bf247c8cae98
      LDK_SERVER_REF: ${{ runner.temp }}/ldk-server-ref
      SPARK_ADMIN_TOKEN: regtest-spark-admin-token
      BREEZ_E2E_PROJECT_NAME: open-ssp-breez-e2e-ci
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev protobuf-compiler
      - name: Check out pinned upstream sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/benthecarman/spark "$SPARK_REF"
          git -C "$SPARK_REF" fetch --depth=1 origin "$SPARK_OPERATOR_COMMIT"
          git -C "$SPARK_REF" checkout --detach FETCH_HEAD
          git clone --filter=blob:none --no-checkout https://github.com/lightningdevkit/ldk-server "$LDK_SERVER_REF"
          git -C "$LDK_SERVER_REF" fetch --depth=1 origin 6d6d810714706c225ce7effc2163eff6a1b54221
          git -C "$LDK_SERVER_REF" checkout --detach FETCH_HEAD
      - name: Run Breez Lightning regtest
        run: ./e2e/ln-e2e.sh
      - name: Stop Lightning test stack
        if: always()
        run: docker compose -p "$BREEZ_E2E_PROJECT_NAME" -f docker-compose.regtest.yml down --volumes --remove-orphans

  ssp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/open-ssp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=master,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ssp.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
