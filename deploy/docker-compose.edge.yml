# Optional TLS edge for the local regtest Compose stack. This file adds Caddy;
# it is not a complete production deployment definition.
#
#   1. cp deploy/.env.example deploy/.env && edit it
#   2. docker compose -f docker-compose.regtest.yml \
#        -f deploy/docker-compose.edge.yml --env-file deploy/.env \
#        up -d ssp ldk-server caddy
#   3. Publish the SSP identity from https://<SSP_DOMAIN>/identity as wallets'
#      sspClientOptions.identityPublicKey (schemaEndpoint graphql/spark/rc).
#   4. Run e2e/e2e.sh to provision and test the local stack.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SSP_DOMAIN: ${SSP_DOMAIN:?set SSP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
