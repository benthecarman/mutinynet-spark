# Second ldk-server regtest node for the end-to-end stack.
[node]
network = "regtest"
listening_addresses = ["0.0.0.0:9735"]
alias = "open-ssp-regtest-2"

[storage.disk]
dir_path = "/data"

[log]
level = "Info"

[tls]
hosts = ["ldk-server-2", "localhost"]

[bitcoind]
rpc_address = "bitcoind:8332"
rpc_user = "testutil"
rpc_password = "testutilpassword"
